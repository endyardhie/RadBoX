# Example FreeRADIUS 3.x unlang policy.
# Adapt table names if your SQL module instance is not named `sql`.

radbox_tenant_guard {
    if (!&control:Tmp-String-0) {
        update control {
            Tmp-String-0 := "%{%{NAS-IP-Address}:-%{Packet-Src-IP-Address}}"
        }
    }

    if ("%{sql:SELECT COUNT(*) FROM rb_vouchers v JOIN rb_routers r ON r.tenant_id = v.tenant_id WHERE v.username = '%{User-Name}' AND r.nas_ip_address = '%{control:Tmp-String-0}' AND v.status NOT IN ('expired','deleted') AND (v.router_id IS NULL OR v.router_id = r.id)}" < 1) {
        reject
    }

    if ("%{sql:SELECT COUNT(*) FROM rb_vouchers WHERE username = '%{User-Name}' AND expires_at IS NOT NULL AND NOW() > expires_at}" > 0) {
        reject
    }

    if ("%{sql:SELECT COUNT(*) FROM rb_vouchers WHERE username = '%{User-Name}' AND total_uptime_limit_seconds > 0 AND total_uptime_used_seconds >= total_uptime_limit_seconds}" > 0) {
        reject
    }
}

# In sites-enabled/default, call this after `sql` in authorize:
#
# authorize {
#     ...
#     sql
#     radbox_tenant_guard
#     ...
# }
