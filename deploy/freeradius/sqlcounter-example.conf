# Example concept for total uptime enforcement.
# App-level sync is included in RadBoX, but production should also enforce limits in FreeRADIUS.

sqlcounter noresetcounter {
    sql_module_instance = sql
    dialect = ${modules.sql.dialect}
    counter_name = Total-Session-Time
    check_name = Max-All-Session
    reply_name = Session-Timeout
    key = User-Name
    reset = never
    query = "SELECT COALESCE(SUM(acctsessiontime),0) FROM radacct WHERE username = '%{%k}'"
}

# Do not treat Session-Timeout as total uptime by itself.
# Total uptime must come from radacct/sqlcounter or RadBoX sync.
