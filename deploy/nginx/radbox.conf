server {
    listen 80;
    server_name radbox.domain.com;
    root /var/www/radbox/public;
    index index.php;

    access_log /var/log/nginx/radbox-access.log;
    error_log /var/log/nginx/radbox-error.log;

    location / {
        try_files $uri $uri/ /index.php?route=$uri&$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
